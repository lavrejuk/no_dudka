<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>NO DUDKA • Илон Маск</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap');
        :root {
            --bg: #0a0a0a;
            --card: #111111;
            --accent: #c026d3; /* неоновый розовый */
            --accent2: #a855f7;
            --neon: #c026d3;
        }
        body {
            font-family: 'Inter', system_ui, sans-serif;
            background: var(--bg);
            color: #fff;
            min-height: 100vh;
            padding: 20px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        .screen { display:none; width:100%; max-width:420px; animation: fade 0.4s ease; }
        .screen.active { display:block; }
        @keyframes fade { from {opacity:0; transform:translateY(40px);} to {opacity:1; transform:none;} }
        h1, h2 { font-family: 'Space Grotesk', sans-serif; }
        button {
            width:100%; padding:16px 20px; border-radius:9999px; font-size:16px; font-weight:600;
            transition:all .3s cubic-bezier(0.4,0,0.2,1);
        }
        button:hover { transform:translateY(-4px) scale(1.02); }
        .neon-button { background:linear-gradient(90deg, #c026d3, #a855f7); box-shadow:0 0 30px rgba(192,38,211,0.6); }
        .icon { font-size:48px; }
        .timer { font-size:44px; font-weight:700; letter-spacing:-2px; }
        .habit-card { background:#111111; border-radius:24px; padding:24px; box-shadow:0 20px 40px -20px rgba(0,0,0,0.7); }
        nav.bottom-nav {
            position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
            background:#111111; border-radius:9999px; padding:10px; box-shadow:0 10px 30px rgba(0,0,0,0.5);
            display:flex; gap:12px; width:92%; max-width:420px;
        }
        .nav-item { flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; padding:12px 0; border-radius:9999px; color:#71717a; font-size:13px; }
        .nav-item.active { color:var(--accent); background:rgba(192,38,211,0.1); }
    </style>
</head>
<body>

<div id="confirm-modal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.7); align-items:center; justify-content:center; z-index:9999;">
    <div class="modal-box text-center bg-[#111111] p-8 rounded-3xl max-w-[340px]">
        <h3 class="text-red-500 text-2xl mb-4">⚠️ Подтверждение</h3>
        <p class="mb-8">Ты действительно хочешь сбросить привычку?</p>
        <button onclick="confirmReset(true)" class="neon-button text-white py-4 w-full">Да, сбросить</button>
        <button onclick="confirmReset(false)" class="outline py-4 w-full mt-3">Отмена</button>
    </div>
</div>

<!-- Приветствие Илона Маск -->
<section id="screen-welcome" class="screen active">
    <div class="text-center">
        <div class="text-8xl mb-6">🚀</div>
        <h1 class="text-5xl font-bold tracking-tighter">NO DUDKA</h1>
        <p class="text-zinc-400 mt-3 text-xl">Освобождайся от вредных привычек — как Илон на Марс</p>
    </div>
    <div class="mt-12 space-y-4 w-full">
        <button onclick="selectHabit('cigarettes')" class="neon-button text-white text-xl py-6">🚬 Сигареты</button>
        <button onclick="selectHabit('vape')" class="neon-button text-white text-xl py-6 mt-3">💨 Вейп</button>
        <button onclick="showCustomInput()" class="outline text-xl py-6 mt-3">➕ Своя привычка</button>
        <div id="custom-block" style="display:none;" class="mt-6">
            <input id="custom-input" type="text" maxlength="30" placeholder="Название привычки" class="w-full bg-zinc-900 rounded-3xl px-6 py-5 text-lg">
            <button onclick="confirmCustom()" class="neon-button w-full mt-4 py-5">Продолжить</button>
        </div>
    </div>
</section>

<!-- Экран добавления -->
<section id="screen-setup" class="screen">
    <h2 class="text-3xl font-semibold mb-8">Новая привычка</h2>
    <div id="habit-label" class="hidden text-xl font-medium mb-6"></div>
    <div id="setup-custom-block" class="hidden">
        <label class="block text-sm text-zinc-400 mb-2">Название привычки</label>
        <input id="setup-name-input" type="text" maxlength="30" placeholder="Например кофе" class="w-full bg-zinc-900 rounded-3xl px-6 py-5">
        <label class="block text-sm text-zinc-400 mt-6 mb-2">Иконка</label>
        <div id="emoji-picker" class="flex flex-wrap gap-5 justify-center"></div>
    </div>
    <label class="block text-sm text-zinc-400 mb-2">Последнее использование</label>
    <input id="last-use-datetime" type="datetime-local" class="w-full bg-zinc-900 rounded-3xl px-6 py-5">
    <!-- поля стоимости (то же, что и раньше, но с новыми классами) -->
    <div id="cost-block" class="mt-8">
        <label class="block text-sm text-zinc-400 mb-2">Стоимость в день</label>
        <input id="daily-cost-input" type="number" min="0" step="0.01" value="0" class="w-full bg-zinc-900 rounded-3xl px-6 py-5">
    </div>
    <div id="cigarettes-cost-fields" class="hidden mt-8 space-y-6">
        <div><label class="block text-sm text-zinc-400 mb-2">Сигарет в день</label><input id="cig-per-day-input" type="number" class="w-full bg-zinc-900 rounded-3xl px-6 py-5"></div>
        <div><label class="block text-sm text-zinc-400 mb-2">Цена пачки (₽)</label><input id="cig-pack-cost-input" type="number" class="w-full bg-zinc-900 rounded-3xl px-6 py-5"></div>
    </div>
    <div id="vape-cost-fields" class="hidden mt-8">
        <label class="block text-sm text-zinc-400 mb-2">Траты в месяц (₽)</label>
        <input id="vape-monthly-cost-input" type="number" class="w-full bg-zinc-900 rounded-3xl px-6 py-5">
    </div>
    <button onclick="saveHabitFromSetup()" id="setup-save-btn" class="neon-button mt-12 text-xl py-7">➕ Добавить привычку</button>
    <button onclick="goToWelcome()" class="outline mt-4 py-7">Назад</button>
</section>

<!-- Главный экран -->
<section id="screen-tracker" class="screen">
    <div class="flex justify-between items-center mb-10">
        <div><h1 class="text-4xl font-bold">NO DUDKA</h1><p class="text-zinc-400">Твой путь к свободе • как у Илона</p></div>
        <div class="text-7xl">🔥</div>
    </div>
    <!-- прогресс, здоровье, контейнер привычек, статистика — (я сделал как раньше, но с новыми классами) -->
    <div class="bg-zinc-900 rounded-3xl p-6 mb-8">
        <div class="flex items-center gap-6">
            <div class="text-6xl">🏆</div>
            <div><div class="text-zinc-400 text-sm">Общий прогресс</div><div id="total-money" class="text-6xl font-bold text-emerald-400">0 ₽</div></div>
        </div>
    </div>
    <div class="bg-zinc-900 rounded-3xl p-6 mb-8">
        <div class="flex justify-between text-sm mb-3"><span>❤️ Восстановление организма</span><span id="health-percent" class="font-bold">0%</span></div>
        <div class="h-3 bg-zinc-800 rounded-full"><div id="health-progress" class="h-full bg-gradient-to-r from-purple-500 via-pink-500 to-violet-500 rounded-full w-0"></div></div>
    </div>
    <div id="habits-container" class="space-y-6"></div>
    <button onclick="showSettings()" class="outline mt-12 py-7">⚙️ Настройки</button>
</section>

<!-- Настройки и меню — (то же самое) -->
<section id="screen-settings" class="screen"> ... (полный код ниже в следующем сообщении) </section>

<nav class="bottom-nav">
    <button onclick="goToTracker()" class="nav-item active">🏠<span>Главная</span></button>
    <button onclick="showSettings()" class="nav-item">📈<span>Статистика</span></button>
    <button onclick="showSettings()" class="nav-item">🏆<span>Достижения</span></button>
    <button onclick="showSettings()" class="nav-item">⚙️<span>Настройки</span></button>
</nav>

</script>
</body>
</html>
